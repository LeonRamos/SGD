services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html

  db:
    image: mysql:8
    container_name: sgd-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sgd
    ports:
      - "3306:3306"
